[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steervit-exp"
version = "0.1.0"
description = "SteerViT experiments — unified training pipeline"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "transformers>=4.57,<5",
  "timm>=1.0,<2",
  "open_clip_torch>=2.31,<4",
  "huggingface_hub>=0.36,<1",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "wandb>=0.19",
  "einops>=0.8,<1",
  "tqdm",
  "numpy>=2.0,<3",
  "scipy",
  "scikit-learn>=1.7,<2",
  "pandas",
  "pyarrow>=18,<22",
  "pillow>=11,<12",
  "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
