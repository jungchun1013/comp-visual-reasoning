# @package _global_
# Supervised ViT backbone + concat self-attn decoder
defaults:
  - override /model: steervit_sup
  - override /data: clevr
  - override /task: decoder
  - override /training: default

data:
  val_batch_size: 512

task:
  decoder:
    type: concat_self_attention
    num_layers: 1
  use_text_gca: true

training:
  epochs: 16

wandb:
  name: clevr_sup_concat_decoder1l_scratch
