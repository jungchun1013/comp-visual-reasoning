# @package _global_
# DINOv2 small (ViT-S/14, ~21M) backbone + concat self-attn decoder — scale reference
# Smallest DINOv2 point; extends the scale axis to S -> B -> L (g dropped, OOM).
defaults:
  - override /model: dinov2_small
  - override /data: clevr
  - override /task: decoder
  - override /training: default

data:
  val_batch_size: 256

task:
  decoder:
    type: concat_self_attention
    num_layers: 1
  use_text_gca: true

training:
  epochs: 16

wandb:
  name: clevr_dinov2s_concat_decoder1l_scratch
