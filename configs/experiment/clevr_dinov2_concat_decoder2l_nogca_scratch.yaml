# @package _global_
# Ablation: concat self-attn decoder (2 layers) without GCA in encoder.
# Aggregation-depth control: can a deeper question-at-readout decoder select
# the referent without in-stream conditioning? (1-layer −CA: 0.4945)
defaults:
  - override /model: steervit_dino
  - override /data: clevr
  - override /task: decoder
  - override /training: default

model:
  checkpoint: null
  cross_attn_layers: [1, 3, 5, 7, 9, 11]
  resolution: 336
  unfreeze_gca: true
  unfreeze_connector: true
  use_steering: false

data:
  val_batch_size: 512

task:
  decoder:
    type: concat_self_attention
    num_layers: 2
  use_text_gca: true

training:
  epochs: 16
  eval_final_only: true

wandb:
  name: clevr_dinov2_concat_decoder2l_nogca_scratch
