# @package _global_
# DINOv2 + GCA (from scratch) + decoder 1L on CoGenT-A
defaults:
  - override /model: steervit_dino
  - override /data: clevr
  - override /task: decoder
  - override /training: default

model:
  checkpoint: null
  cross_attn_layers: [1, 3, 5, 7, 9, 11]
  resolution: 336
  unfreeze_gca: true
  unfreeze_connector: true

data:
  root: /home/jungchun/data/clevr/CLEVR_CoGenT_v1.0
  train_split: trainA
  val_split: valA
  val_batch_size: 128

task:
  decoder:
    num_layers: 1

wandb:
  name: cogent_dinov2_decoder1l_scratch

training:
  epochs: 16
