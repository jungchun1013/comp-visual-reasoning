# @package _global_
# Ablation: No GCA — pure DINOv2 backbone, no text conditioning
defaults:
  - override /model: steervit_dino
  - override /data: clevr
  - override /task: decoder
  - override /training: default

model:
  checkpoint: null
  cross_attn_layers: [1, 3, 5, 7, 9, 11]
  resolution: 336
  unfreeze_gca: true
  unfreeze_connector: true
  use_steering: false

data:
  val_batch_size: 512

task:
  decoder:
    num_layers: 1

training:
  epochs: 16
