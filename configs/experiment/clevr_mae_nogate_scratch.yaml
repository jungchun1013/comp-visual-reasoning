# @package _global_
# Ablation: MAE + GCA without tanh gating
defaults:
  - override /model: steervit_mae
  - override /data: clevr
  - override /task: decoder
  - override /training: default

model:
  checkpoint: null
  cross_attn_layers: [1, 3, 5, 7, 9, 11]
  resolution: 224
  unfreeze_gca: true
  unfreeze_connector: true
  use_gate: false

data:
  val_batch_size: 128

task:
  decoder:
    num_layers: 1

wandb:
  name: clevr_mae_nogate_scratch

training:
  epochs: 16
