# @package _global_
# Ablation: GCA without tanh gating (x = x + CA output, no learned scalar)
defaults:
  - override /model: steervit_dino
  - override /data: clevr
  - override /task: decoder
  - override /training: default

model:
  checkpoint: null
  cross_attn_layers: [1, 3, 5, 7, 9, 11]
  resolution: 336
  unfreeze_gca: true
  unfreeze_connector: true
  use_gate: false

data:
  val_batch_size: 128

wandb:
  name: clevr_dinov2_nogate_scratch

task:
  decoder:
    num_layers: 1

training:
  epochs: 16
