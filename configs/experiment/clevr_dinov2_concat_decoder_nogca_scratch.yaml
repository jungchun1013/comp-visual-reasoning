# @package _global_
# Ablation: concat self-attn decoder without GCA in encoder
defaults:
  - override /model: steervit_dino
  - override /data: clevr
  - override /task: decoder
  - override /training: default

model:
  checkpoint: null
  cross_attn_layers: [1, 3, 5, 7, 9, 11]
  resolution: 336
  unfreeze_gca: true
  unfreeze_connector: true
  use_steering: false

data:
  val_batch_size: 512

task:
  decoder:
    type: concat_self_attention
    num_layers: 1
  use_text_gca: true

training:
  epochs: 16

wandb:
  name: clevr_dinov2_concat_decoder1l_nogca_scratch
